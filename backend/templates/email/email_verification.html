<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Verify Your Email</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background: #4caf50;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 5px 5px 0 0;
      }
      .content {
        background: #f9f9f9;
        padding: 30px;
        border-radius: 0 0 5px 5px;
      }
      .button {
        display: inline-block;
        padding: 12px 24px;
        background: #4caf50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
      .otp-box {
        background: #fff;
        border: 2px dashed #4caf50;
        padding: 15px;
        text-align: center;
        margin: 20px 0;
        border-radius: 8px;
      }
      .otp-code {
        font-size: 32px;
        font-weight: bold;
        color: #4caf50;
        letter-spacing: 8px;
      }
      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header"><h1>📚 Library Management System</h1></div>
    <div class="content">
      <h2>Hello {{ user.get_full_name|default:user.username }}!</h2>
      <p>Thank you for registering. Please verify your email address:</p>

      <!-- ✅ OTP Display -->
      <div class="otp-box">
        <p style="margin: 0 0 10px 0; font-size: 14px; color: #666">
          Your OTP Code:
        </p>
        <div class="otp-code">{{ otp }}</div>
      </div>

      <p>Or click the button below to verify:</p>
      <div style="text-align: center">
        <a href="{{ verification_url }}" class="button">✅ Verify Email</a>
      </div>
      <p><small>This OTP expires in {{ expires_in }}.</small></p>
    </div>
    <div class="footer"><p>© 2026 Mekdela Amba University</p></div>
  </body>
</html>
